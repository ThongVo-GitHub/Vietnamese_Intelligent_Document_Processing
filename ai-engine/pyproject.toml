[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-vn-ai-engine"
version = "0.1.0"
description = "Standalone AI/OCR and Vietnamese document extraction microservice for DocFlow VN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "python-multipart>=0.0.20,<1.0.0",
    "rapidocr-onnxruntime>=1.2.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
ocr = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "vietocr>=0.3.13",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
