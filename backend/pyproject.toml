[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-vn-backend"
version = "0.1.0"
description = "Backend API for DocFlow VN"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "defusedxml>=0.7.1",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.2",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
ocr = [
    "torch>=2.2",
    "torchvision>=0.17",
    "vietocr>=0.3.13",
]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
