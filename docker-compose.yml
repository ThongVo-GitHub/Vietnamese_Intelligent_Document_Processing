services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: docflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docflow}

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: docflow-backend:dev
    container_name: docflow-migrate
    restart: "no"
    command:
      - python
      - -m
      - alembic
      - -c
      - alembic.ini
      - upgrade
      - head

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}"

    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: docflow-backend:dev
    container_name: docflow-backend
    restart: unless-stopped

    environment:
      APP_NAME: "${APP_NAME:-DocFlow VN API}"
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}"
      UPLOAD_DIR: "/app/data/uploads"
      MAX_UPLOAD_SIZE_BYTES: "${MAX_UPLOAD_SIZE_BYTES:-10485760}"

    ports:
      - "8000:8000"

    volumes:
      - uploads_data:/app/data/uploads

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: docflow-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile

    image: docflow-ai-engine:dev
    container_name: docflow-ai-engine
    restart: unless-stopped

    environment:
      MAX_UPLOAD_SIZE_BYTES: "${MAX_UPLOAD_SIZE_BYTES:-10485760}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:1.5b}"

    ports:
      - "8001:8001"

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: docflow-backend:dev
    container_name: docflow-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}"
      UPLOAD_DIR: "/app/data/uploads"
      WORKER_POLL_INTERVAL_SECONDS: "${WORKER_POLL_INTERVAL_SECONDS:-2}"
      AI_ENGINE_MODE: "${AI_ENGINE_MODE:-http}"
      AI_ENGINE_URL: "${AI_ENGINE_URL:-http://ai-engine:8001}"
      AI_ENGINE_TIMEOUT_SECONDS: "${AI_ENGINE_TIMEOUT_SECONDS:-60}"

    volumes:
      - uploads_data:/app/data/uploads

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  ollama_data: